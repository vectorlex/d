[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = true
sort_dir_first = true
sort_translit = true
linemode = "size_and_mtime"
show_hidden = true
show_symlink = false

[preview]
tab_size = 2
image_filter = "lanczos3"

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

