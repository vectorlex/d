# More option see https://github.com/DreamMaoMao/mango/wiki/

# Environments
env=LANG,zh_CN.UTF-8
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_IM_MODULES,wayland;fcitx
env=QT_IM_MODULE,fcitx
env=XMODIFIERS=@im,fcitx

# Monitors
monitorrule=name:DP-3,width:2560,height:1440,refresh:180

# Autoexecs
exec-once=swaybg -m fill -i ~/Pictures/Wallpapers/a.jpg
exec-once=waybar
exec-once=fcitx5 -d

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.4
fadein_begin_opacity=0.4
fadeout_begin_opacity=0.4
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=300
animation_duration_close=400
animation_duration_focus=300
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=1
scroller_ignore_proportion_single=0
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.5,0.75

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30

# Misc
allow_tearing=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x00000000
bordercolor=0x585b70ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x89b4faff
maximizescreencolor=0x89b4faff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0x89b4faff
overlaycolor=0x89b4faff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,$HOME/.config/mango/scripts/launcher.sh
bind=SUPER,x,spawn,$HOME/.config/mango/scripts/logout.sh
bind=SUPER,t,spawn,kitty
bind=SUPER,return,spawn,thorium-browser

# exit
bind=SUPER+SHIFT,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=CTRL+SUPER,Up,exchange_client,up
bind=CTRL+SUPER,Down,exchange_client,down
bind=CTRL+SUPER,Left,exchange_client,left
bind=CTRL+SUPER,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER+SHIFT,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right

# tag switch
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SHIFT+SUPER,1,tag,1,0
bind=SHIFT+SUPER,2,tag,2,0
bind=SHIFT+SUPER,3,tag,3,0
bind=SHIFT+SUPER,4,tag,4,0
bind=SHIFT+SUPER,5,tag,5,0
bind=SHIFT+SUPER,6,tag,6,0
bind=SHIFT+SUPER,7,tag,7,0
bind=SHIFT+SUPER,8,tag,8,0
bind=SHIFT+SUPER,9,tag,9,0

bind=SHIFT,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=CTRL,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh window
bind=NONE,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze-region

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Window rules
windowrule=appid:thorium-browser,scroller_proportion:0.75

# Layer rules
layerrule=layer_name:notifications,animation_type_open:slide,animation_type_close:slide

